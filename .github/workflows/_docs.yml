name: _Docs (reusable)

permissions:
  contents: write
  pages: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  workflow_call:
    inputs:
      environment:
        description: 'GitHub environment to use'
        type: string
        default: 'github-pages'
      docs-version:
        description: 'Documentation version name (e.g., v1.0.0, main)'
        type: string
        required: true
      docs-alias:
        description: 'Documentation alias (e.g., latest)'
        type: string
        default: ''
      docs-default:
        description: 'Set this as the default version redirect (e.g., latest)'
        type: string
        default: ''
      docs-prerelease:
        description: 'Mark this version as pre-release (shows unstable banner)'
        type: boolean
        default: false
    secrets:
      DAGGER_CLOUD_TOKEN:
        required: true

jobs:
  docs:
    runs-on: depot-ubuntu-latest
    environment: ${{ inputs.environment }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6.0.2
        with:
          # The Dagger module copies .git, which needs the full history.
          fetch-depth: 0
          # The checkout's token must not be stored in that copy.
          persist-credentials: false

      - name: Install Dagger
        run: curl -fsSL https://dl.dagger.io/dagger/install.sh | DAGGER_VERSION=1.0.0-beta.24 BIN_DIR="$HOME/.local/bin" sh

      - name: Build and deploy documentation
        env:
          DAGGER_CLOUD_TOKEN: ${{ secrets.DAGGER_CLOUD_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          DOCS_VERSION: ${{ inputs.docs-version }}
          DOCS_ALIAS: ${{ inputs.docs-alias }}
          DOCS_DEFAULT: ${{ inputs.docs-default }}
          DOCS_PRERELEASE: ${{ inputs.docs-prerelease }}
        run: >
          dagger call --engine=cloud deploy-docs
          --version "$DOCS_VERSION"
          --alias "$DOCS_ALIAS"
          --default "$DOCS_DEFAULT"
          --prerelease="$DOCS_PRERELEASE"
          --github-token env://GITHUB_TOKEN

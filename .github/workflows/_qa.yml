name: _QA (reusable)

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  workflow_call:
    inputs:
      python-versions:
        description: "JSON array of Python versions to test"
        type: string
        default: '["3.11"]'
      run-windows:
        description: "Run Windows tests"
        type: boolean
        default: false
      run-macos:
        description: "Run macOS tests"
        type: boolean
        default: false
      run-all-checks:
        description: "Run all checks regardless of path filters"
        type: boolean
        default: false
      dependency-matrix:
        description: "Run the compat test suites, which test other dependency versions"
        type: boolean
        default: false
      use-tach:
        description: "Use tach to skip unaffected tests"
        type: boolean
        default: true
    secrets:
      DAGGER_CLOUD_TOKEN:
        required: false
      CODECOV_TOKEN:
        required: false

jobs:
  filter:
    runs-on: depot-ubuntu-latest
    outputs:
      test: ${{ steps.filter.outputs.test }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6.0.2
      - uses: dorny/paths-filter@v4.0.0
        id: filter
        with:
          filters: |
            test:
              - '.github/workflows/**'
              - .envrc
              - devenv.nix
              - devenv.lock
              - devenv.yaml
              - 'src/metaxy/**'
              - 'tests/**'
              - 'examples/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - tests.toml
              - dagger.toml
              - dagger.lock
              - '.dagger/**'

  extra-suites:
    runs-on: depot-ubuntu-latest
    outputs:
      suites: ${{ steps.suites.outputs.suites }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6.0.2
      - name: List the heavy and compat test suites to run
        id: suites
        env:
          COMPAT: ${{ inputs.dependency-matrix }}
        run: |
          python3 - >> "$GITHUB_OUTPUT" <<'EOF'
          import json, os, tomllib
          with open("tests.toml", "rb") as f:
              suites = tomllib.load(f)["suites"]
          compat = os.environ["COMPAT"] == "true"
          names = [name for name, spec in suites.items() if spec.get("heavy") or (compat and spec.get("compat"))]
          print("suites=" + json.dumps(names))
          EOF

  test-extra:
    needs: [filter, extra-suites]
    if: ${{ (inputs.run-all-checks || needs.filter.outputs.test == 'true') && needs.extra-suites.outputs.suites != '[]' }}
    permissions:
      contents: read
    runs-on: depot-ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJSON(needs.extra-suites.outputs.suites) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6.0.2
        with:
          # The suites read the history since the merge base with main to skip unaffected tests.
          fetch-depth: 0
      - name: Install Dagger
        run: curl -fsSL https://dl.dagger.io/dagger/install.sh | DAGGER_VERSION=1.0.0-beta.24 BIN_DIR="$HOME/.local/bin" sh
      - name: Run ${{ matrix.suite }} tests
        env:
          DAGGER_CLOUD_TOKEN: ${{ secrets.DAGGER_CLOUD_TOKEN }}
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        # On main, the suites upload coverage to Codecov with the token.
        run: >
          dagger call --engine=cloud
          ${{ github.ref == 'refs/heads/main' && '--codecov-token env://CODECOV_TOKEN' || '' }}
          extra-tests
          get --key ${{ matrix.suite }}
          run

  test-python-versions:
    needs: filter
    # Cloud Checks run the suites on Python 3.11; this job runs them on the other versions.
    if: ${{ (inputs.run-all-checks || needs.filter.outputs.test == 'true') && inputs.python-versions != '["3.11"]' }}
    permissions:
      contents: read
    runs-on: depot-ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJSON(inputs.python-versions) }}
        exclude:
          - python-version: "3.11"
    steps:
      - name: Checkout code
        uses: actions/checkout@v6.0.2
        with:
          # The suites read the history since the merge base with main to skip unaffected tests.
          fetch-depth: 0
      - name: Install Dagger
        run: curl -fsSL https://dl.dagger.io/dagger/install.sh | DAGGER_VERSION=1.0.0-beta.24 BIN_DIR="$HOME/.local/bin" sh
      - name: Run the test suites on Python ${{ matrix.python-version }}
        env:
          DAGGER_CLOUD_TOKEN: ${{ secrets.DAGGER_CLOUD_TOKEN }}
        # The python-<version> workspace environments in dagger.toml set the suites' Python version.
        run: >
          dagger check --engine=cloud
          --env "python-${{ matrix.python-version }}"
          'dag+check://?check=run'

  test-windows:
    needs: filter
    if: ${{ inputs.run-windows && (inputs.run-all-checks || needs.filter.outputs.test == 'true') }}
    permissions:
      contents: read
    runs-on: windows-latest
    env:
      UV_PYTHON_PREFERENCE: only-system
      PYTHONUTF8: "1"
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJSON(inputs.python-versions) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6.0.2
      - name: Fetch main branch
        if: github.ref != 'refs/heads/main'
        run: git fetch origin main:main

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6.2.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7.5.0
        with:
          enable-cache: true

      - name: Install Dependencies
        run: |
          uv python pin ${{ matrix.python-version }}
          uv sync --group dev --all-extras --no-extra clickhouse

      - name: Run Tests
        run: >
          uv run pytest
          -k "not clickhouse and not graphviz"
          --ignore=tests/docs
          --ignore=tests/cli
          --ignore=tests/examples
          --ignore=tests/ext/ray
          --ignore=tests/ext/clickhouse
          --ignore=tests/project
          --durations=15
          --snapshot-warn-unused
          ${{ inputs.use-tach && '--tach' || ' ' }}

  test-macos:
    needs: filter
    if: ${{ inputs.run-macos && (inputs.run-all-checks || needs.filter.outputs.test == 'true') }}
    permissions:
      contents: read
    runs-on: macos-latest
    env:
      UV_PYTHON_PREFERENCE: only-system
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJSON(inputs.python-versions) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6.0.2
      - name: Fetch main branch
        if: github.ref != 'refs/heads/main'
        run: git fetch origin main:main

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6.2.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7.5.0
        with:
          enable-cache: true

      - name: Install Dependencies
        run: |
          uv python pin ${{ matrix.python-version }}
          uv sync --group dev --all-extras --no-extra clickhouse

      - name: Run Tests
        run: >
          uv run pytest
          -k "not clickhouse and not graphviz"
          --ignore=tests/docs
          --ignore=tests/ext/ray
          --ignore=tests/ext/clickhouse
          --durations=15
          --snapshot-warn-unused
          ${{ inputs.use-tach && '--tach' || ' ' }}

  check:
    permissions: {}
    if: always()
    runs-on: depot-ubuntu-latest
    needs:
      - extra-suites
      - test-extra
      - test-python-versions
      - test-windows
      - test-macos

    steps:
      - name: All Green
        if: always()
        uses: re-actors/alls-green@v1.2.2
        with:
          jobs: ${{ toJSON(needs) }}
          allowed-skips: test-extra, test-python-versions, test-windows, test-macos

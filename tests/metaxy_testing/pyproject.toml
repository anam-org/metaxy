[project]
name = "metaxy-testing"
version = "0.0.1"
description = "Testing utilities for Metaxy"
requires-python = ">=3.11"
dependencies = [
  "metaxy",
  "pydantic",
  "tabulate",
]

[build-system]
requires = ["uv_build>=0.8.19,<0.9.0"]
build-backend = "uv_build"

[project.scripts]
mxtest-analyze-timings = "metaxy_testing.analyze_timings:main"

[tool.uv.sources]
metaxy = { workspace = true }
